<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img"
  aria-labelledby="art-screening-title">
  <title id="art-screening-title">Candidate profiles being screened down to a shortlist</title>

  <defs>
    <linearGradient id="scr-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F9" />
      <stop offset="1" stop-color="#D7E6F4" />
    </linearGradient>
    <pattern id="scr-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="2.2" fill="#096BB3" opacity=".28" />
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect x="40" y="24" width="480" height="392" rx="28" fill="url(#scr-panel)" />
  <rect x="404" y="330" width="126" height="90" fill="url(#scr-dots)" />

  <!-- incoming stack, the unscreened pile -->
  <g>
    <rect x="70" y="70" width="210" height="58" rx="14" fill="#fff" opacity=".55" />
    <rect x="78" y="60" width="210" height="58" rx="14" fill="#fff" opacity=".75" />
    <rect x="86" y="50" width="210" height="58" rx="14" fill="#fff" />
    <circle cx="116" cy="79" r="15" fill="#D7E6F4" />
    <path d="M110 84a7 7 0 0112 0z" fill="#9FBFDC" />
    <circle cx="116" cy="73" r="5.4" fill="#9FBFDC" />
    <rect x="142" y="68" width="98" height="8" rx="4" fill="#2F2F2F" opacity=".82" />
    <rect x="142" y="84" width="66" height="7" rx="3.5" fill="#5F6A72" opacity=".45" />
  </g>

  <!-- funnel -->
  <path d="M120 150h320l-96 104v62l-128 34v-96z" fill="#096BB3" opacity=".10" />
  <path d="M120 150h320l-96 104v62l-128 34v-96z" fill="none" stroke="#096BB3" stroke-width="2.5"
    stroke-linejoin="round" opacity=".55" />

  <!-- rejected profiles falling away -->
  <g opacity=".5">
    <circle cx="96" cy="250" r="13" fill="#fff" />
    <path d="M91 254a5.6 5.6 0 0110 0z" fill="#B9C6D2" />
    <circle cx="96" cy="245.5" r="4.4" fill="#B9C6D2" />
  </g>
  <g opacity=".35">
    <circle cx="474" cy="232" r="11" fill="#fff" />
    <path d="M470 236a4.6 4.6 0 018 0z" fill="#B9C6D2" />
    <circle cx="474" cy="228.5" r="3.7" fill="#B9C6D2" />
  </g>

  <!-- the shortlist card -->
  <g>
    <rect x="150" y="286" width="268" height="118" rx="18" fill="#fff" />
    <rect x="150" y="286" width="268" height="118" rx="18" fill="none" stroke="#096BB3" stroke-width="2"
      opacity=".18" />

    <rect x="170" y="306" width="84" height="8" rx="4" fill="#096BB3" />

    <!-- three shortlisted rows -->
    <g>
      <circle cx="184" cy="340" r="12" fill="#E8F1F9" />
      <path d="M179 344a5 5 0 0110 0z" fill="#096BB3" />
      <circle cx="184" cy="335.5" r="4" fill="#096BB3" />
      <rect x="204" y="333" width="112" height="7" rx="3.5" fill="#2F2F2F" opacity=".8" />
      <rect x="204" y="345" width="70" height="6" rx="3" fill="#5F6A72" opacity=".4" />
      <circle cx="396" cy="340" r="9" fill="#096BB3" />
      <path d="M392 340l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </g>
    <g transform="translate(0 34)">
      <circle cx="184" cy="340" r="12" fill="#E8F1F9" />
      <path d="M179 344a5 5 0 0110 0z" fill="#096BB3" />
      <circle cx="184" cy="335.5" r="4" fill="#096BB3" />
      <rect x="204" y="333" width="94" height="7" rx="3.5" fill="#2F2F2F" opacity=".8" />
      <rect x="204" y="345" width="56" height="6" rx="3" fill="#5F6A72" opacity=".4" />
      <circle cx="396" cy="340" r="9" fill="#096BB3" />
      <path d="M392 340l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" />
    </g>
  </g>

  <!-- magnifier, the screening itself -->
  <g transform="translate(362 150)">
    <circle cx="44" cy="44" r="40" fill="#fff" opacity=".92" />
    <circle cx="44" cy="44" r="40" fill="none" stroke="#E30C17" stroke-width="5" />
    <path d="M73 73l26 26" stroke="#E30C17" stroke-width="9" stroke-linecap="round" />
    <path d="M30 45l10 10 19-22" fill="none" stroke="#E30C17" stroke-width="5.5" stroke-linecap="round"
      stroke-linejoin="round" />
  </g>
</svg>
