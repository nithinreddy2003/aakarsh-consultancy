<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" role="img" aria-labelledby="art-why-title">
  <title id="art-why-title">A senior consultant reviewing a mandate at the desk</title>

  <defs>
    <linearGradient id="why-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F9" />
      <stop offset="1" stop-color="#CFE2F2" />
    </linearGradient>
    <pattern id="why-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="2.2" fill="#096BB3" opacity=".22" />
    </pattern>
  </defs>

  <rect width="450" height="600" rx="24" fill="url(#why-bg)" />
  <rect x="24" y="26" width="108" height="90" fill="url(#why-dots)" />

  <!-- wall chart, top right -->
  <g>
    <rect x="246" y="52" width="168" height="116" rx="14" fill="#fff" />
    <rect x="266" y="72" width="58" height="8" rx="4" fill="#096BB3" />
    <rect x="266" y="88" width="34" height="6" rx="3" fill="#5F6A72" opacity=".35" />
    <g>
      <rect x="266" y="130" width="20" height="22" rx="4" fill="#096BB3" opacity=".3" />
      <rect x="294" y="118" width="20" height="34" rx="4" fill="#096BB3" opacity=".55" />
      <rect x="322" y="106" width="20" height="46" rx="4" fill="#096BB3" />
      <rect x="350" y="124" width="20" height="28" rx="4" fill="#E30C17" />
    </g>
  </g>

  <!-- the consultant: head and shoulders, clear of everything else -->
  <g>
    <circle cx="132" cy="214" r="48" fill="#fff" />
    <circle cx="132" cy="205" r="18" fill="#096BB3" />
    <path d="M104 238a28 28 0 0156 0z" fill="#096BB3" />
    <!-- shoulders down to the desk line -->
    <path d="M54 356c0-43 35-78 78-78s78 35 78 78z" fill="#fff" />
    <!-- collar, plus an ID badge in brand red -->
    <path d="M110 288a30 30 0 0044 0" fill="none" stroke="#E8F1F9" stroke-width="6" stroke-linecap="round" />
    <rect x="160" y="312" width="30" height="20" rx="5" fill="#E30C17" />
    <rect x="166" y="319" width="18" height="4" rx="2" fill="#fff" opacity=".85" />
  </g>

  <!-- open laptop, beside the consultant rather than over them -->
  <g>
    <path d="M250 356v-54a8 8 0 018-8h130a8 8 0 018 8v54z" fill="#fff" />
    <rect x="264" y="306" width="118" height="38" rx="5" fill="#E8F1F9" />
    <rect x="276" y="316" width="46" height="6" rx="3" fill="#096BB3" />
    <rect x="276" y="328" width="76" height="5" rx="2.5" fill="#5F6A72" opacity=".3" />
  </g>

  <!-- desk -->
  <rect x="28" y="356" width="394" height="16" rx="8" fill="#fff" />
  <rect x="62" y="372" width="14" height="78" rx="7" fill="#fff" opacity=".6" />
  <rect x="374" y="372" width="14" height="78" rx="7" fill="#fff" opacity=".6" />

  <!-- shortlist sheet on the desk -->
  <g>
    <rect x="48" y="398" width="186" height="104" rx="14" fill="#fff" />
    <rect x="70" y="420" width="62" height="8" rx="4" fill="#096BB3" />
    <g>
      <circle cx="80" cy="450" r="9" fill="#E8F1F9" />
      <circle cx="80" cy="447" r="3.4" fill="#096BB3" />
      <path d="M75 453a5 5 0 0110 0z" fill="#096BB3" />
      <rect x="98" y="446" width="76" height="6" rx="3" fill="#2F2F2F" opacity=".7" />
      <rect x="196" y="445" width="20" height="8" rx="4" fill="#096BB3" opacity=".35" />
    </g>
    <g transform="translate(0 28)">
      <circle cx="80" cy="450" r="9" fill="#E8F1F9" />
      <circle cx="80" cy="447" r="3.4" fill="#096BB3" />
      <path d="M75 453a5 5 0 0110 0z" fill="#096BB3" />
      <rect x="98" y="446" width="58" height="6" rx="3" fill="#2F2F2F" opacity=".7" />
      <rect x="196" y="445" width="20" height="8" rx="4" fill="#096BB3" opacity=".35" />
    </g>
  </g>

  <!-- approved mark -->
  <g transform="translate(284 404)">
    <circle cx="38" cy="38" r="36" fill="#fff" />
    <circle cx="38" cy="38" r="28" fill="none" stroke="#E30C17" stroke-width="4" opacity=".85" />
    <path d="M26 38l9 9 17-19" fill="none" stroke="#E30C17" stroke-width="5" stroke-linecap="round"
      stroke-linejoin="round" />
  </g>

  <!-- standing-since marker -->
  <g>
    <rect x="48" y="524" width="200" height="54" rx="16" fill="#fff" />
    <rect x="70" y="540" width="52" height="11" rx="5.5" fill="#096BB3" />
    <rect x="70" y="558" width="146" height="6" rx="3" fill="#5F6A72" opacity=".35" />
  </g>
</svg>
