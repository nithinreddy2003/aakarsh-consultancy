<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="art-careers-title">
  <title id="art-careers-title">A candidate profile moving through to an offer</title>

  <defs>
    <linearGradient id="car-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F9" />
      <stop offset="1" stop-color="#D7E6F4" />
    </linearGradient>
    <pattern id="car-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="2.2" fill="#096BB3" opacity=".26" />
    </pattern>
  </defs>

  <rect x="40" y="24" width="480" height="392" rx="28" fill="url(#car-panel)" />
  <rect x="408" y="36" width="108" height="86" fill="url(#car-dots)" />

  <!-- the CV -->
  <g>
    <rect x="86" y="70" width="188" height="248" rx="18" fill="#fff" />
    <circle cx="180" cy="126" r="26" fill="#E8F1F9" />
    <circle cx="180" cy="117" r="9.5" fill="#096BB3" />
    <path d="M166 135a14 14 0 0128 0z" fill="#096BB3" />
    <rect x="132" y="168" width="96" height="8" rx="4" fill="#2F2F2F" opacity=".8" />
    <rect x="148" y="186" width="64" height="7" rx="3.5" fill="#5F6A72" opacity=".4" />
    <rect x="112" y="214" width="136" height="6" rx="3" fill="#D7E6F4" />
    <rect x="112" y="230" width="136" height="6" rx="3" fill="#D7E6F4" />
    <rect x="112" y="246" width="96" height="6" rx="3" fill="#D7E6F4" />
    <!-- skill pills -->
    <rect x="112" y="272" width="50" height="18" rx="9" fill="#E8F1F9" />
    <rect x="168" y="272" width="38" height="18" rx="9" fill="#E8F1F9" />
    <rect x="212" y="272" width="36" height="18" rx="9" fill="#FDE7E8" />
  </g>

  <!-- progress track -->
  <g>
    <path d="M300 150h150" stroke="#096BB3" stroke-width="3" stroke-linecap="round" opacity=".3"
      stroke-dasharray="2 12" />
    <path d="M300 232h150" stroke="#096BB3" stroke-width="3" stroke-linecap="round" opacity=".3"
      stroke-dasharray="2 12" />

    <!-- stage 1 -->
    <g>
      <rect x="300" y="128" width="166" height="44" rx="14" fill="#fff" />
      <circle cx="324" cy="150" r="11" fill="#096BB3" />
      <path d="M320 150l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round" />
      <rect x="344" y="146" width="86" height="7" rx="3.5" fill="#2F2F2F" opacity=".72" />
    </g>

    <!-- stage 2 -->
    <g>
      <rect x="300" y="210" width="166" height="44" rx="14" fill="#fff" />
      <circle cx="324" cy="232" r="11" fill="#096BB3" />
      <path d="M320 232l3 3 5.5-6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"
        stroke-linejoin="round" />
      <rect x="344" y="228" width="68" height="7" rx="3.5" fill="#2F2F2F" opacity=".72" />
    </g>

    <!-- offer -->
    <g>
      <rect x="300" y="292" width="166" height="56" rx="16" fill="#E30C17" />
      <rect x="322" y="310" width="78" height="8" rx="4" fill="#fff" opacity=".95" />
      <rect x="322" y="326" width="48" height="7" rx="3.5" fill="#fff" opacity=".6" />
      <circle cx="434" cy="320" r="13" fill="#fff" />
      <path d="M428 320l4 4 7-8" fill="none" stroke="#E30C17" stroke-width="2.8" stroke-linecap="round"
        stroke-linejoin="round" />
    </g>
  </g>
</svg>
