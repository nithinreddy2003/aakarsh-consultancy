<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" role="img" aria-labelledby="art-grid-1-title">
  <title id="art-grid-1-title">An interview in progress between a client panel and a candidate</title>

  <defs>
    <linearGradient id="g1-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F9" />
      <stop offset="1" stop-color="#CFE2F2" />
    </linearGradient>
  </defs>

  <rect width="450" height="600" rx="24" fill="url(#g1-bg)" />

  <!-- window light behind -->
  <g opacity=".5">
    <rect x="266" y="54" width="140" height="150" rx="12" fill="#fff" />
    <path d="M336 54v150M266 129h140" stroke="#CFE2F2" stroke-width="5" />
  </g>

  <!-- candidate, facing the panel -->
  <g>
    <circle cx="132" cy="252" r="42" fill="#fff" />
    <circle cx="132" cy="244" r="16" fill="#E30C17" />
    <path d="M108 272a24 24 0 0148 0z" fill="#E30C17" />
    <path d="M58 404c0-41 33-74 74-74s74 33 74 74z" fill="#fff" />
  </g>

  <!-- interviewer, back of head, nearer camera -->
  <g>
    <circle cx="328" cy="296" r="46" fill="#fff" opacity=".95" />
    <circle cx="328" cy="288" r="17" fill="#096BB3" />
    <path d="M302 318a26 26 0 0152 0z" fill="#096BB3" />
    <path d="M250 450c0-43 35-78 78-78s78 35 78 78z" fill="#fff" opacity=".95" />
  </g>

  <!-- table across the middle -->
  <rect x="24" y="446" width="402" height="18" rx="9" fill="#fff" />

  <!-- papers on the table -->
  <g>
    <rect x="62" y="470" width="120" height="76" rx="10" fill="#fff" />
    <rect x="80" y="488" width="46" height="7" rx="3.5" fill="#096BB3" />
    <rect x="80" y="504" width="84" height="5" rx="2.5" fill="#5F6A72" opacity=".3" />
    <rect x="80" y="516" width="68" height="5" rx="2.5" fill="#5F6A72" opacity=".3" />
    <rect x="80" y="528" width="76" height="5" rx="2.5" fill="#5F6A72" opacity=".3" />
  </g>

  <!-- scoring card -->
  <g>
    <rect x="252" y="482" width="134" height="64" rx="12" fill="#fff" />
    <rect x="272" y="500" width="52" height="7" rx="3.5" fill="#2F2F2F" opacity=".7" />
    <g>
      <circle cx="278" cy="524" r="7" fill="#096BB3" />
      <circle cx="298" cy="524" r="7" fill="#096BB3" />
      <circle cx="318" cy="524" r="7" fill="#096BB3" />
      <circle cx="338" cy="524" r="7" fill="#DCE4EC" />
      <circle cx="358" cy="524" r="7" fill="#DCE4EC" />
    </g>
  </g>
</svg>
