<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="art-team-title">
  <title id="art-team-title">A consultant team reviewing mandates across industries</title>

  <defs>
    <linearGradient id="team-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F9" />
      <stop offset="1" stop-color="#D7E6F4" />
    </linearGradient>
    <pattern id="team-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2.2" cy="2.2" r="2.2" fill="#E30C17" opacity=".22" />
    </pattern>
  </defs>

  <rect x="40" y="24" width="480" height="392" rx="28" fill="url(#team-panel)" />
  <rect x="44" y="330" width="108" height="86" fill="url(#team-dots)" />

  <!-- mandate board -->
  <g>
    <rect x="96" y="58" width="368" height="150" rx="18" fill="#fff" />
    <rect x="120" y="82" width="104" height="8" rx="4" fill="#096BB3" />

    <!-- bars: mandates filled by level -->
    <g>
      <rect x="120" y="170" width="38" height="14" rx="6" fill="#D7E6F4" />
      <rect x="120" y="140" width="38" height="44" rx="6" fill="#096BB3" />
    </g>
    <g>
      <rect x="172" y="170" width="38" height="14" rx="6" fill="#D7E6F4" />
      <rect x="172" y="124" width="38" height="60" rx="6" fill="#096BB3" />
    </g>
    <g>
      <rect x="224" y="170" width="38" height="14" rx="6" fill="#D7E6F4" />
      <rect x="224" y="150" width="38" height="34" rx="6" fill="#096BB3" opacity=".6" />
    </g>
    <g>
      <rect x="276" y="170" width="38" height="14" rx="6" fill="#D7E6F4" />
      <rect x="276" y="112" width="38" height="72" rx="6" fill="#E30C17" />
    </g>
    <g>
      <rect x="328" y="170" width="38" height="14" rx="6" fill="#D7E6F4" />
      <rect x="328" y="146" width="38" height="38" rx="6" fill="#096BB3" opacity=".6" />
    </g>

    <!-- trend line -->
    <path d="M139 132l52-16 52 26 52-38 52 34" fill="none" stroke="#2F2F2F" stroke-width="2.5" stroke-linecap="round"
      stroke-linejoin="round" opacity=".28" />

    <rect x="392" y="82" width="48" height="20" rx="10" fill="#E8F1F9" />
    <path d="M404 92l4 4 8-9" fill="none" stroke="#096BB3" stroke-width="2.6" stroke-linecap="round"
      stroke-linejoin="round" />
  </g>

  <!-- the team, four consultants -->
  <g>
    <!-- 1 -->
    <g transform="translate(112 252)">
      <rect x="0" y="0" width="92" height="124" rx="16" fill="#fff" />
      <circle cx="46" cy="40" r="17" fill="#096BB3" />
      <path d="M24 82a22 22 0 0144 0z" fill="#096BB3" />
      <rect x="22" y="96" width="48" height="7" rx="3.5" fill="#2F2F2F" opacity=".75" />
      <rect x="30" y="108" width="32" height="6" rx="3" fill="#5F6A72" opacity=".4" />
    </g>
    <!-- 2 -->
    <g transform="translate(214 252)">
      <rect x="0" y="0" width="92" height="124" rx="16" fill="#fff" />
      <circle cx="46" cy="40" r="17" fill="#E30C17" />
      <path d="M24 82a22 22 0 0144 0z" fill="#E30C17" />
      <rect x="22" y="96" width="48" height="7" rx="3.5" fill="#2F2F2F" opacity=".75" />
      <rect x="30" y="108" width="32" height="6" rx="3" fill="#5F6A72" opacity=".4" />
    </g>
    <!-- 3 -->
    <g transform="translate(316 252)">
      <rect x="0" y="0" width="92" height="124" rx="16" fill="#fff" />
      <circle cx="46" cy="40" r="17" fill="#676767" />
      <path d="M24 82a22 22 0 0144 0z" fill="#676767" />
      <rect x="22" y="96" width="48" height="7" rx="3.5" fill="#2F2F2F" opacity=".75" />
      <rect x="30" y="108" width="32" height="6" rx="3" fill="#5F6A72" opacity=".4" />
    </g>
    <!-- 4 -->
    <g transform="translate(418 252)">
      <rect x="0" y="0" width="56" height="124" rx="16" fill="#fff" opacity=".6" />
      <circle cx="28" cy="40" r="15" fill="#9FBFDC" />
      <path d="M9 80a19 19 0 0138 0z" fill="#9FBFDC" />
      <rect x="12" y="96" width="32" height="7" rx="3.5" fill="#2F2F2F" opacity=".35" />
    </g>
  </g>
</svg>
