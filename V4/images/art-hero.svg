<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="art-hero-title">
  <title id="art-hero-title">A consultant handing over a shortlist of screened, interview-ready candidates</title>

  <defs>
    <linearGradient id="hero-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07" />
    </linearGradient>
    <pattern id="hero-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2.4" cy="2.4" r="2.4" fill="#ffffff" opacity=".35" />
    </pattern>
  </defs>

  <!-- soft panel on the blue hero -->
  <rect x="96" y="40" width="592" height="476" rx="34" fill="url(#hero-panel)" />
  <rect x="30" y="52" width="120" height="100" fill="url(#hero-dots)" />

  <!-- main shortlist card -->
  <g>
    <rect x="212" y="78" width="430" height="300" rx="24" fill="#fff" />

    <!-- card header -->
    <rect x="244" y="110" width="132" height="10" rx="5" fill="#096BB3" />
    <rect x="244" y="130" width="86" height="8" rx="4" fill="#5F6A72" opacity=".35" />
    <g>
      <rect x="520" y="106" width="92" height="30" rx="15" fill="#E8F1F9" />
      <circle cx="540" cy="121" r="7" fill="#096BB3" />
      <path d="M537 121l2.4 2.4 4.4-5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"
        stroke-linejoin="round" />
      <rect x="554" y="117" width="44" height="7" rx="3.5" fill="#096BB3" opacity=".55" />
    </g>

    <line x1="244" y1="160" x2="612" y2="160" stroke="#DCE4EC" stroke-width="2" />

    <!-- shortlisted candidate rows -->
    <g>
      <circle cx="266" cy="196" r="18" fill="#E8F1F9" />
      <circle cx="266" cy="190" r="6.6" fill="#096BB3" />
      <path d="M256 202a10 10 0 0120 0z" fill="#096BB3" />
      <rect x="298" y="186" width="160" height="9" rx="4.5" fill="#2F2F2F" opacity=".82" />
      <rect x="298" y="202" width="104" height="7" rx="3.5" fill="#5F6A72" opacity=".4" />
      <rect x="520" y="186" width="92" height="22" rx="11" fill="#096BB3" opacity=".12" />
      <rect x="534" y="193" width="64" height="7" rx="3.5" fill="#096BB3" opacity=".7" />
    </g>

    <g transform="translate(0 62)">
      <circle cx="266" cy="196" r="18" fill="#E8F1F9" />
      <circle cx="266" cy="190" r="6.6" fill="#096BB3" />
      <path d="M256 202a10 10 0 0120 0z" fill="#096BB3" />
      <rect x="298" y="186" width="132" height="9" rx="4.5" fill="#2F2F2F" opacity=".82" />
      <rect x="298" y="202" width="86" height="7" rx="3.5" fill="#5F6A72" opacity=".4" />
      <rect x="520" y="186" width="92" height="22" rx="11" fill="#096BB3" opacity=".12" />
      <rect x="534" y="193" width="64" height="7" rx="3.5" fill="#096BB3" opacity=".7" />
    </g>

    <g transform="translate(0 124)">
      <circle cx="266" cy="196" r="18" fill="#FDE7E8" />
      <circle cx="266" cy="190" r="6.6" fill="#E30C17" />
      <path d="M256 202a10 10 0 0120 0z" fill="#E30C17" />
      <rect x="298" y="186" width="148" height="9" rx="4.5" fill="#2F2F2F" opacity=".82" />
      <rect x="298" y="202" width="94" height="7" rx="3.5" fill="#5F6A72" opacity=".4" />
      <rect x="520" y="186" width="92" height="22" rx="11" fill="#E30C17" opacity=".12" />
      <rect x="534" y="193" width="64" height="7" rx="3.5" fill="#E30C17" opacity=".8" />
    </g>
  </g>

  <!-- the consultant, foreground left -->
  <g>
    <!-- chair back -->
    <rect x="128" y="372" width="150" height="14" rx="7" fill="#07558F" opacity=".5" />
    <!-- body -->
    <path d="M120 470a84 84 0 01168 0z" fill="#fff" />
    <path d="M120 470a84 84 0 0184-84v84z" fill="#E8F1F9" opacity=".8" />
    <!-- head -->
    <circle cx="204" cy="330" r="46" fill="#fff" />
    <circle cx="204" cy="330" r="46" fill="none" stroke="#E8F1F9" stroke-width="3" />
    <circle cx="204" cy="322" r="17" fill="#096BB3" />
    <path d="M178 352a26 26 0 0152 0z" fill="#096BB3" />
    <!-- arm holding the folder -->
    <path d="M254 418l84-26" stroke="#fff" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- the handed-over folder, overlapping -->
  <g>
    <rect x="322" y="356" width="178" height="112" rx="18" fill="#fff" />
    <rect x="322" y="356" width="178" height="112" rx="18" fill="none" stroke="#E8F1F9" stroke-width="3" />
    <rect x="348" y="382" width="72" height="9" rx="4.5" fill="#096BB3" />
    <rect x="348" y="402" width="126" height="7" rx="3.5" fill="#5F6A72" opacity=".3" />
    <rect x="348" y="418" width="100" height="7" rx="3.5" fill="#5F6A72" opacity=".3" />
    <g transform="translate(446 420)">
      <circle cx="18" cy="18" r="18" fill="#E30C17" />
      <path d="M11 18l5 5 10-11" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"
        stroke-linejoin="round" />
    </g>
  </g>

  <!-- floating badge: no CV sifting -->
  <g>
    <rect x="516" y="404" width="166" height="62" rx="18" fill="#fff" />
    <circle cx="548" cy="435" r="15" fill="#E8F1F9" />
    <path d="M541 435l5 5 9-10" fill="none" stroke="#096BB3" stroke-width="3" stroke-linecap="round"
      stroke-linejoin="round" />
    <rect x="574" y="424" width="84" height="8" rx="4" fill="#2F2F2F" opacity=".8" />
    <rect x="574" y="440" width="56" height="7" rx="3.5" fill="#5F6A72" opacity=".4" />
  </g>
</svg>
