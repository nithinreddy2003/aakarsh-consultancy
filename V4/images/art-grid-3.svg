<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 450" role="img" aria-labelledby="art-grid-3-title">
  <title id="art-grid-3-title">A placed candidate joining the client team</title>

  <defs>
    <linearGradient id="g3-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F1F9" />
      <stop offset="1" stop-color="#D7E6F4" />
    </linearGradient>
  </defs>

  <rect width="450" height="450" rx="24" fill="url(#g3-bg)" />

  <!-- handshake, abstracted as two interlocking arms -->
  <g>
    <path d="M70 232h128l34 24" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"
      stroke-linejoin="round" />
    <path d="M380 232H252l-34-24" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round"
      stroke-linejoin="round" />
    <circle cx="225" cy="244" r="34" fill="#096BB3" />
    <path d="M211 244l10 10 19-21" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"
      stroke-linejoin="round" />
  </g>

  <!-- the two parties -->
  <g>
    <circle cx="80" cy="150" r="34" fill="#fff" />
    <circle cx="80" cy="143" r="13" fill="#096BB3" />
    <path d="M60 167a20 20 0 0140 0z" fill="#096BB3" />

    <circle cx="370" cy="150" r="34" fill="#fff" />
    <circle cx="370" cy="143" r="13" fill="#E30C17" />
    <path d="M350 167a20 20 0 0140 0z" fill="#E30C17" />
  </g>

  <!-- joining card -->
  <g>
    <rect x="112" y="320" width="226" height="86" rx="18" fill="#fff" />
    <rect x="138" y="344" width="78" height="9" rx="4.5" fill="#096BB3" />
    <rect x="138" y="364" width="150" height="7" rx="3.5" fill="#5F6A72" opacity=".3" />
    <rect x="138" y="380" width="112" height="7" rx="3.5" fill="#5F6A72" opacity=".3" />
  </g>
</svg>
